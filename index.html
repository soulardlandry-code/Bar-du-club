<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#164f3d"><link rel="manifest" href="manifest.webmanifest"><title>Le Bar du Club</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6efe3;color:#17251f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding:max(56px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}.app{width:100%;max-width:600px;margin:0 auto}
header{background:#164f3d;color:#fff;border-radius:0 0 22px 22px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h1{font-size:25px;margin:0 0 8px}.sub{font-size:18px}.headtotal{font-size:36px;font-weight:850;white-space:nowrap}
.item{display:grid;grid-template-columns:62px 1fr auto;align-items:center;min-height:96px;background:#fffaf2;border:2px solid #e3d5bf;border-radius:20px;margin:9px 0;padding:10px 12px}.ico{font-size:38px;text-align:center}.name{font-size:20px;font-weight:800;line-height:1.15}.price{font-size:17px;font-weight:800;color:#17604a;margin-top:7px}.controls{display:flex;align-items:center;gap:10px}.controls button{width:62px;height:62px;border:0;border-radius:17px;font-size:35px;font-weight:900}.minus{background:#e9e0d2;color:#164f3d}.plus{background:#164f3d;color:#fff}.qty{min-width:28px;text-align:center;font-size:24px;font-weight:850}
.total{display:flex;justify-content:space-between;align-items:center;background:#164f3d;color:#fff;border-radius:19px;padding:13px 16px;margin:10px 0;font-size:25px;font-weight:850}.total span:last-child{color:#f4cf76;font-size:28px}.cash{background:#fffaf2;border:2px solid #e3d5bf;border-radius:20px;padding:12px;margin-top:10px}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:19px;font-weight:800}.cash input{width:145px;height:54px;border:2px solid #cbb99f;border-radius:14px;background:#fff;font-size:25px;text-align:right;padding:5px 9px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.quick button{height:48px;border:0;border-radius:14px;background:#e9e0d2;color:#0788ed;font-size:18px;font-weight:800}.change{border-top:2px solid #e3d5bf;padding-top:10px}.change strong{font-size:27px}#reset{width:100%;height:55px;margin-top:10px;border:2px solid #cbb99f;border-radius:17px;background:#f8f1e6;color:#944936;font-size:18px;font-weight:800}
</style></head><body><div class="app"><header><div><h1>🍻 Le Bar du Club</h1><div class="sub" id="articles">0 article sélectionné</div></div><div class="headtotal" id="headTotal">0,00 €</div></header><div id="items"></div><div class="total"><span>Total à payer</span><span id="total">0,00 €</span></div><div class="cash"><div class="line"><label for="given">💶 Somme donnée</label><div><input id="given" inputmode="decimal"> €</div></div><div class="quick"><button data-cash="5">5 €</button><button data-cash="10">10 €</button><button data-cash="20">20 €</button><button data-cash="50">50 €</button></div><div class="line change"><span id="changeLabel">Monnaie à rendre</span><strong id="change">0,00 €</strong></div></div><button id="reset">↻ Nouvelle partie</button></div>
<script>
const products=[["🍺","Bière pression",1.60],["🍷","Vin / Cidre / Café — 10 cl",0.80],["🥤","Petit soda / jus de fruit",0.40],["🧃","Grand soda / jus de fruit",0.80],["🥪","Sandwich",1.50]],q=[0,0,0,0,0],items=document.getElementById("items"),money=n=>n.toFixed(2).replace(".",",")+" €";
products.forEach((p,i)=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<div class="ico">${p[0]}</div><div><div class="name">${p[1]}</div><div class="price">${money(p[2])}</div></div><div class="controls"><button class="minus" data-i="${i}">−</button><span class="qty" id="q${i}">0</span><button class="plus" data-i="${i}">+</button></div>`;items.appendChild(d)});
function calc(){let count=q.reduce((a,b)=>a+b,0),total=q.reduce((s,n,i)=>s+n*products[i][2],0);articles.textContent=count+" article"+(count>1?"s":"")+" sélectionné"+(count>1?"s":"");document.getElementById("total").textContent=money(total);headTotal.textContent=money(total);let given=parseFloat(givenEl.value.replace(",","."))||0,diff=given-total;if(given>0&&diff<0){changeLabel.textContent="Il manque";change.textContent=money(-diff)}else{changeLabel.textContent="Monnaie à rendre";change.textContent=money(Math.max(0,diff))}}
const givenEl=document.getElementById("given");document.addEventListener("click",e=>{if(e.target.matches(".plus,.minus")){let i=+e.target.dataset.i;e.target.classList.contains("plus")?q[i]++:q[i]=Math.max(0,q[i]-1);document.getElementById("q"+i).textContent=q[i];calc()}if(e.target.dataset.cash){givenEl.value=e.target.dataset.cash;calc()}});givenEl.addEventListener("input",calc);reset.addEventListener("click",()=>{q.fill(0);q.forEach((_,i)=>document.getElementById("q"+i).textContent=0);givenEl.value="";calc()});if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));calc();
</script></body></html>
